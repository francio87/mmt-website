name: Build and publish container

on:
  push:
    branches:
      - master

permissions:
  # write is needed to create the Git tag and the GitHub release.
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # ponytail: run-number versions can skip after failed builds; use Git tags if gap-free versions are needed.
          echo "version=1.0.$((GITHUB_RUN_NUMBER - 1))" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          # Override the labels inherited from the nginx base image, so tools
          # like Renovate and GHCR link this image to its own repository.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.title=Marmitte dei Giganti, Fossombrone: how to visit
            org.opencontainers.image.description=Static Astro website for the Marmitte dei Giganti in Fossombrone.

      # Runs after the push, so a release exists only for a published image.
      # The tag matches the image version, so Renovate can show these notes in its PRs.
      - name: Create Git tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.image.outputs.version }}
        run: gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
